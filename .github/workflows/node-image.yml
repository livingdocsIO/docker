name: Node image

on:
  workflow_call:
    inputs:
      dockerfile:
        type: string
        required: true
      version:
        type: string
        required: true
      pointer_compression:
        type: boolean
        required: true
      build_node:
        type: boolean
        required: true
      node_tags:
        type: string
        required: true
      node_tag:
        type: string
        required: true
      bases:
        type: string
        required: true

permissions:
  contents: read

env:
  IMAGE: livingdocs/node

jobs:
  node:
    if: inputs.build_node
    name: node ${{ matrix.platform }}
    strategy:
      matrix:
        platform: [amd64, arm64]
    # Native runners, compiling pointer compression node under qemu would take far too long
    runs-on: ${{ matrix.platform == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 360
    steps:
      - name: Free disk space for the node compilation
        if: inputs.pointer_compression
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache

      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          platforms: linux/${{ matrix.platform }}
          labels: org.opencontainers.image.version=${{ inputs.version }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Verify node version and pointer compression
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          EXPECTED: v${{ inputs.version }} pc=${{ inputs.pointer_compression && '1' || '0' }}
        run: |
          got=$(docker run --rm "$IMAGE@$DIGEST" node -p 'process.version + " pc=" + process.config.variables.v8_enable_pointer_compression')
          echo "$got"
          [ "$got" = "$EXPECTED" ] || { echo "::error::expected $EXPECTED"; exit 1; }

      - env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: mkdir -p "$RUNNER_TEMP/digests" && touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ inputs.node_tag }}-${{ matrix.platform }}
          overwrite: true
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    needs: node
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ inputs.node_tag }}-*
          merge-multiple: true

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ inputs.node_tags }}
        run: |
          tags=()
          for tag in $(jq -r '.[]' <<< "$TAGS"); do tags+=(-t "$tag"); done
          digests=()
          for digest in *; do digests+=("$IMAGE@sha256:$digest"); done
          [ "${#digests[@]}" = 2 ] || { echo "::error::expected 2 digests, got ${#digests[@]}"; exit 1; }
          docker buildx imagetools create "${tags[@]}" "${digests[@]}"
          docker buildx imagetools inspect "${tags[1]}"

  bases:
    needs: manifest
    if: ${{ !cancelled() && !failure() && inputs.bases != '[]' }}
    name: ${{ matrix.base.repo }}
    strategy:
      fail-fast: false
      matrix:
        base: ${{ fromJSON(inputs.bases) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.base.context }}
          file: ${{ matrix.base.dockerfile }}
          platforms: linux/amd64,linux/arm64
          # The exact node tag, so a base never builds on a node image of another run
          build-args: VERSION=${{ inputs.node_tag }}
          tags: ${{ join(matrix.base.tags, ',') }}
          push: true
